<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form>
        <h1>Регистрация</h1>
        <input class="my_input" name="phone number" type="number" placeholder="Введите Ваш номер телефона">
        <input class="my_input" name="email" type="email" placeholder="Введите Вашу почту">
        <input class="my_input" name="password" type="password" placeholder="Введите пароль">

        <button type="button" class="btn">Зарегестрироваться</button>
    </form>
    <script src="script.js"></script>
</body>
</html>
